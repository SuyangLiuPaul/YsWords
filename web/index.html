<!DOCTYPE html>
<html spellcheck="false">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- 2026-06-11 audit: this tag was MISSING since project creation
       (git log -S confirms it never existed here). Without it, mobile
       browsers lay the page out at the legacy 980px desktop viewport
       and scale down — a root cause of "iOS web vs Android looks
       different" reports. Standard Flutter-template value. -->
  <!-- 2026-06-28: viewport-fit=cover was tried (to read env(safe-area-
       inset-*) for the forward-looking iPadOS-26 window-control inset) but
       REVERTED the same day — it caused a GLOBAL tap-position offset on
       iOS Safari: every icon tap landed on the element BELOW it. Cause:
       with viewport-fit=cover the iOS Safari VISUAL viewport diverges from
       the LAYOUT viewport and Flutter web's pointer mapping ends up offset
       from what's painted (flutter/flutter#183596, #179208). The env()
       inset never worked on iPadOS 26 anyway (WebKit doesn't report the
       windowed traffic-light controls to a PWA — Apple gap), so this was
       all downside. Native app is the path for clean windowed iPad.
       Keep the plain, weeks-stable value. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <!-- 2026-06-12 (v1.3.62 perf): pre-open the TLS connection to the
       CDN that serves CanvasKit (~1.5 MB, on the boot critical path).
       Saves a DNS + TCP + TLS round trip before the engine download
       can even start. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yahweh's Words 雅伟之言 — a bilingual Bible reader app to help you listen to His voice and abide in Him daily.">

  <!-- Disable iOS Safari data-detection (auto-linking of dates/phone numbers)
       and spell-check underlining on Flutter web HTML renderer elements. -->
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">

  <!-- iOS PWA meta tags. Without apple-mobile-web-app-capable=yes,
       Add-to-Home-Screen on iPhone opens YsWords in Safari instead
       of full-screen, breaking the app feel. Status bar style is
       'default' so the iOS status bar contrasts our white surface. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yahweh's Words">
  <!-- 2026-05-10 (v1.2.31): align theme-color across the meta tags
       and the manifest. Previously the manifest claimed Material
       blue (#2196F3) while the meta tag claimed white — Android's
       installed PWA address-bar would tint blue while iOS Safari
       and the meta-aware Chrome tab tinted white. Align both to
       the white surface that the LIGHT theme actually paints. The
       second meta tag below kicks in when the OS reports
       prefers-color-scheme: dark so the address bar / status bar
       matches the app's dark surface (closer to the dark theme's
       Card colour) instead of staying white. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F1F1F">

  <!-- iOS Add-to-Home-Screen icons. iOS picks the closest size to
       its current launcher (180×180 on iPhone, 167×167 on iPad,
       152×152 on older iPads). We point all sizes at the 1024×1024
       master and let iOS downscale — looks crisper than shipping
       pre-baked downscales for our simple flat icon. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-512.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-512.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">

  <!-- Favicon — link to the 192 icon as an SVG-equivalent fallback,
       plus the legacy favicon.png for older browsers. -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Static default only. The boot script near the end of <body>
       rewrites this to the reader's own language — see the comment
       there. English is the default because it is what a crawler,
       a link preview, or a reader with storage blocked should get. -->
  <title>Yahweh's Words</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Preload tags removed (round 51).

    The previous preloads pointed at `assets/<file>` (e.g.
    `assets/kjv.json`, `assets/loading.png`), but Flutter web
    actually fetches bundled assets from `assets/assets/<file>`
    (the user-facing `assets/` directory is itself nested under
    Flutter's `assets/` URL prefix). The browser preloaded the
    WRONG URLs, never used them, and fired ~198 "preloaded but not
    used within a few seconds" warnings on every page load. We do
    not need preloads anyway — Flutter's own asset loader handles
    the fetch, and the bundle is service-worker-cached after the
    first visit. Keeping this comment here so the rationale is
    obvious if anyone considers re-adding them.
  -->

  <style>
    /* CSS reset: strip the default body margin + paint a warm
       background so the browser's default white 8px-margin body
       doesn't bleed through at the edges of the Flutter canvas
       (the thin white strips flanking the reader).

       v1.3.x (post-revert): DELIBERATELY minimal. The earlier
       version also forced `overflow: hidden; width/height: 100%`
       on html+body — that was unnecessary for the white-edge fix
       and is the prime suspect for the blank-home regression that
       reverted prod off v1.3.48/49. Flutter's engine sizes its own
       view; we only need to kill the margin + set a backdrop colour
       and let Flutter manage layout/scroll. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FFF8F6;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #1F1F1F; }
    }
    /* Strip browser-injected styling from iOS Safari data-detector <a> tags
       (phone numbers, dates, addresses auto-linked by Safari on the HTML renderer). */
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: inherit !important;
      font-size: inherit !important;
      font-weight: inherit !important;
    }
    /* Suppress tap highlight flash on all Flutter interactive elements. */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    /* iPhone 14 (iOS 17/18 Safari) sometimes renders certain glyphs in
       the profile / greeting card stacked vertically — happens when a
       fallback CJK font's OpenType `vert` feature gets applied or
       Safari's data-detector wraps the text in a way that flips
       writing-mode.  Force horizontal layout globally so the bug
       can't surface on any device.  Other phones already render
       horizontally, so this is a no-op for them. */
    html, body, flutter-view, flt-glass-pane, flt-scene-host {
      writing-mode: horizontal-tb !important;
      text-orientation: mixed !important;
      -webkit-text-orientation: mixed !important;
      -webkit-locale: auto;
    }
    /* Belt-and-braces: nuke any inherited `vert` font-feature setting
       that ships in Microsoft YaHei or other CJK fallbacks. */
    body, body * {
      font-feature-settings: "vert" off;
    }
  </style>

  <!-- Windows tile metadata — kept here, NOT the iOS / generic PWA
       meta tags which already appear earlier in <head> with their
       intended values.  The previous duplicates redefined
       theme-color / status-bar-style with conflicting values
       ('default' vs 'black-translucent') and the LAST one won,
       producing the wrong status-bar tint on iOS PWAs. -->
  <meta name="msapplication-TileImage" content="assets/app_icon.png">
  <meta name="msapplication-TileColor" content="#2196F3">
</head>
<body>
  <!-- Cache-busting self-heal. Old Flutter service workers from a
       previous build can keep serving stale HTML / JS to returning
       users; Netlify's `Cache-Control: no-cache` headers on /,
       /index.html, /flutter_bootstrap.js, and /main.dart.js handle
       the HTTP cache layer, but a leftover SW would still bypass
       that. This script unregisters every SW + nukes every cache
       bucket on each load and forces a single auto-reload if
       anything was torn down — guarded by sessionStorage to prevent
       loops.

       2026-05-10 (v1.2.31): the previous version of this script
       included a `__BUILD_STAMP__` token meant to be rewritten by
       a Netlify post-processing step that never existed. The
       `stampChanged` branch was dead code (`BUILD_STAMP ===
       '__BUILD_STAMP__'` short-circuited it to false on every
       deploy). Removed the stamp logic; the SW-unregister path
       does the heavy lifting alone, plus the `no-cache` HTTP
       headers ensure the next navigation pulls fresh bytes. The
       `window.yswordsClearCacheAndReload` helper below remains
       available for the LoadingPage error scaffold + Settings →
       "Clear cache & reload" — it's the manual escape hatch on
       top of the auto-recovery here. -->
  <script>
    (function() {
      var RELOAD_KEY = 'yswords_self_heal_reloaded';
      var alreadyReloaded = false;
      try {
        alreadyReloaded = sessionStorage.getItem(RELOAD_KEY) === '1';
      } catch (_) {}

      function maybeReload() {
        if (alreadyReloaded) return;
        try { sessionStorage.setItem(RELOAD_KEY, '1'); } catch (_) {}
        // Netlify's no-cache headers on / index.html / bootstrap /
        // main.dart.js force network re-fetch on the reload.
        location.reload();
      }

      // 2026-08-09: the sweep is now NARROWED rather than total.
      //
      // Its purpose is to stop a stale Flutter service worker serving
      // old HTML/JS — that is what caused the incident it was written
      // for. The song-media worker is a different animal: it is scoped
      // to /song-media/* only, never touches the app shell, and holds
      // audio the user asked to keep offline. Tearing it down every
      // load meant offline listening could never work at all.
      //
      // So: unregister every worker EXCEPT ours, and delete every
      // cache bucket EXCEPT the song-media one. The stale-shell
      // protection is unchanged.
      //
      // 2026-08-24: a second exemption, for the same reason. The
      // app-shell worker's own bucket (`yswords-shell-<version>`) is
      // its ONLY offline fallback, and this block runs on every load —
      // without the exemption the shell cache was refilled and deleted
      // once per visit, i.e. offline never worked. Exempting it is safe
      // because that worker is network first: nothing in this bucket is
      // ever served to a user who has a network, and the worker rotates
      // the bucket itself on activate when the build version changes.
      var MEDIA_CACHE_PREFIX = 'song-media-';
      var SHELL_CACHE_PREFIX = 'yswords-shell-';

      var unregisterCount = 0;
      // 2026-08-24: this used to sweep EVERY worker on EVERY load —
      // `var stale = regs` with no filter — and the first fix that day
      // narrowed it to spare `flutter_service_worker.js`. Sparing that
      // one turned out to be pointless: on Flutter 3.44 the build
      // OVERWRITES that file with a 784-byte stub that unregisters
      // itself on activate, so there was still no worker left after a
      // load — `getRegistrations()` returned 0, `beforeinstallprompt`
      // therefore never fired, and the in-app Install button correctly
      // reported that nothing was available. Reported by the user as
      // 「网页版安装install也安不上」 and reproduced in a browser.
      //
      // The app now ships its own worker (web/app_shell_sw.js, network
      // first — read its header before touching it), so THAT is the one
      // registration the sweep must leave alone. Matched on a substring
      // of the script URL because the URL carries a `?v=<version>`
      // query.
      //
      // Everything else still goes, which is the whole point of the
      // block: a STALE shell worker from an older deploy — including
      // Flutter's stub and the long-dead /song-media/ one — is exactly
      // what this was written to evict, and that protection is
      // unchanged. Ours cannot go stale in the same way: it never
      // answers from cache while the network is up, and its script URL
      // rotates with the build version.
      var OUR_SW = 'app_shell_sw.js';
      var swPromise = ('serviceWorker' in navigator)
        ? navigator.serviceWorker.getRegistrations().then(function(regs) {
            var stale = regs.filter(function(r) {
              var url = (r.active && r.active.scriptURL) ||
                        (r.installing && r.installing.scriptURL) ||
                        (r.waiting && r.waiting.scriptURL) || '';
              return url.indexOf(OUR_SW) === -1;
            });
            unregisterCount = stale.length;
            return Promise.all(stale.map(function(r) {
              return r.unregister().catch(function() {});
            }));
          }).catch(function() { return; })
        : Promise.resolve();

      var cachePromise = (window.caches && caches.keys)
        ? caches.keys().then(function(keys) {
            return Promise.all(keys
              .filter(function(k) {
                return k.indexOf(MEDIA_CACHE_PREFIX) !== 0 &&
                       k.indexOf(SHELL_CACHE_PREFIX) !== 0;
              })
              .map(function(k) {
                return caches.delete(k).catch(function() {});
              }));
          }).catch(function() { return; })
        : Promise.resolve();

      Promise.all([swPromise, cachePromise]).then(function() {
        if (unregisterCount > 0) maybeReload();

        // The media Service Worker is GONE — deliberately.
        //
        // It was registered with `scope: '/song-media/'`, and a
        // worker's scope decides which PAGES it controls, not which
        // requests it is allowed to see. The app is served from '/',
        // so it controlled nothing and its fetch handler never ran
        // once: dead from the day it shipped. Verified in a browser —
        // `serviceWorker.controller` was null and media came back
        // from Netlify.
        //
        // Widening it to '/' does not work either: the app-shell
        // worker claims root scope (as Flutter's generated one did
        // before it), and two scripts cannot share one scope — the
        // later registration simply replaces the earlier. Competing
        // for it would trade offline media for a stale app shell.
        //
        // Web offline playback now reads Cache Storage directly and
        // hands the audio element a blob URL (see
        // lib/services/song_download_web.dart). Nothing in the fetch
        // path, nothing to claim, and no Range-request handling
        // needed because a blob URL is not fetched over HTTP.
        //
        // The `song-media-` cache exemption in the sweep above stays:
        // that bucket is where downloads live.

        // Now register OUR app-shell worker — web/app_shell_sw.js.
        //
        // 2026-08-24 (「网页版安装install也安不上」): Chrome only fires
        // `beforeinstallprompt` when a service worker with a fetch
        // handler controls start_url, and this app had none — Flutter
        // 3.44 replaced its generated worker with a stub that
        // unregisters itself, so there was nothing to control anything.
        // This registration is the fix; web/flutter_bootstrap.js stops
        // the stub being registered over the top of it.
        //
        // CHAINED HERE, inside the sweep's `.then`, deliberately: the
        // sweep unregisters every worker whose script URL is not ours,
        // so registering in parallel with it would be a race the sweep
        // could win, tearing down the worker we just asked for.
        //
        // `?v=` carries the build's own version (version.json, written
        // by `flutter build web` from pubspec). A new version means a
        // new script URL, which is what prompts the browser to install
        // the new worker at all, and it rotates the worker's cache name
        // so the previous build's offline shell is dropped.
        //
        // Every step is best-effort and silent. Offline support is a
        // nice-to-have; a failure here must never keep the app from
        // starting, so a missing version.json degrades to 'dev' and a
        // refused registration is swallowed.
        if (!('serviceWorker' in navigator)) return;
        return fetch('version.json', {cache: 'no-store'})
          .then(function(r) { return r.json(); })
          .then(function(v) { return (v && v.version) || 'dev'; })
          .catch(function() { return 'dev'; })
          .then(function(v) {
            return navigator.serviceWorker.register(
              'app_shell_sw.js?v=' + encodeURIComponent(v));
          })
          .catch(function() {});
      });
    })();
  </script>
  <!-- 2026-05-24 (v1.3.25): PWA install-prompt bridge.
       Captures the `beforeinstallprompt` event Chrome / Edge fire
       when the user could install the PWA. The Flutter side reads
       `window.yswordsInstall.available` to decide whether to show
       the "Install YsWords" affordance, and calls
       `window.yswordsInstall.show()` to trigger the native picker.
       Also exposes `isStandalone` so the same affordance hides
       once the user is already running in installed mode.

       2026-08-24: this bridge was dead for three months for a
       reason outside itself — Chrome only fires beforeinstallprompt
       when a service worker with a fetch handler controls
       start_url, and the app had no surviving worker at all, so the
       event never arrived and `available` never went true (the
       user's 「网页版安装install也安不上」). The sweep above now spares
       web/app_shell_sw.js and registers it, so the precondition
       finally holds and this code path goes live unchanged.
       `isStandalone` was always independent of the worker (it
       detects Add-to-Home-Screen on iOS Safari + post-install
       Chrome) and keeps working as before. -->
  <script>
    window.yswordsInstall = {
      // True after a beforeinstallprompt event arrives.
      available: false,
      // The captured event — Flutter calls `.prompt()` via show().
      _event: null,
      // True if the page is running in standalone / installed mode
      // (Add-to-Home-Screen on iOS, installed PWA on Android,
      // chrome://apps launch on desktop).
      get isStandalone() {
        try {
          if (window.navigator.standalone === true) return true; // iOS Safari
          if (window.matchMedia('(display-mode: standalone)').matches) return true;
          if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
          if (window.matchMedia('(display-mode: minimal-ui)').matches) return true;
        } catch (_) {}
        return false;
      },
      // Triggers the browser's native install picker. Returns a
      // promise that resolves to 'accepted' | 'dismissed' | 'unavailable'.
      show: async function() {
        var e = this._event;
        if (!e) return 'unavailable';
        try {
          e.prompt();
          var choice = await e.userChoice;
          this._event = null;
          this.available = false;
          return (choice && choice.outcome) || 'dismissed';
        } catch (err) {
          return 'dismissed';
        }
      }
    };
    window.addEventListener('beforeinstallprompt', function(e) {
      // Prevent Chrome's default mini-infobar so we can drive the
      // UX from the app side.
      e.preventDefault();
      window.yswordsInstall._event = e;
      window.yswordsInstall.available = true;
    });
    window.addEventListener('appinstalled', function() {
      window.yswordsInstall._event = null;
      window.yswordsInstall.available = false;
    });
  </script>
  <!-- Avatar picker: opens an `<input type="file">`, reads the
       chosen image, center-crops to a square, resizes to 256×256
       via Canvas, and resolves with a JPEG data URL. Used by the
       Profile editor so local users can set a custom avatar
       without shipping any image-picker package. Resolves with
       null on cancel / read error. The setTimeout-after-focus
       trick handles the cancel case (file inputs don't fire any
       event when the user closes the picker without choosing). -->
  <script>
    window.yswordsPickAvatar = function() {
      return new Promise(function(resolve) {
        var done = false;
        function finish(v) { if (done) return; done = true; resolve(v); }
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';
        document.body.appendChild(input);
        function cleanup() {
          if (input.parentNode) document.body.removeChild(input);
        }
        input.addEventListener('change', function() {
          var file = input.files && input.files[0];
          if (!file) { cleanup(); return finish(null); }
          var reader = new FileReader();
          reader.onload = function() {
            var img = new Image();
            img.onload = function() {
              var size = 256;
              var canvas = document.createElement('canvas');
              canvas.width = size;
              canvas.height = size;
              var ctx = canvas.getContext('2d');
              var srcSize = Math.min(img.width, img.height);
              var sx = (img.width - srcSize) / 2;
              var sy = (img.height - srcSize) / 2;
              ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
              cleanup();
              try {
                finish(canvas.toDataURL('image/jpeg', 0.85));
              } catch (e) {
                finish(null);
              }
            };
            img.onerror = function() { cleanup(); finish(null); };
            img.src = reader.result;
          };
          reader.onerror = function() { cleanup(); finish(null); };
          reader.readAsDataURL(file);
        });
        // Cancel detection: when the file picker closes without a
        // selection, no event fires on the input. Listen for window
        // re-focus and assume cancel after a small delay — gives
        // the change event time to fire if the user did choose a
        // file just before the picker closes.
        window.addEventListener('focus', function once() {
          window.removeEventListener('focus', once);
          setTimeout(function() {
            if (!done) { cleanup(); finish(null); }
          }, 800);
        }, {once: true});
        input.click();
      });
    };
  </script>
  <!-- Browser Notification helper used by lib/services/notification_service_web.dart.
       Wraps `new Notification(title, options)` so the Dart side can pass an options
       bag without hitting Dart's inline-class language feature (only available
       in Dart 3.3+; we target 3.2.3). -->
  <script>
    window.yswordsShowNotification = function(title, options) {
      try {
        if (typeof Notification === 'undefined') return null;
        if (Notification.permission !== 'granted') return null;
        return new Notification(title, options || {});
      } catch (e) {
        return null;
      }
    };
  </script>
  <!-- In-app "Clear cache & reload" helper. Called from the Settings
       → About card via dart:js_interop. Wipes the same surfaces the
       boot-time self-heal does (service workers, Cache Storage,
       build-stamp localStorage entry) but ALSO marks
       yswords_self_heal_reloaded fresh so the post-reload self-heal
       picks up the new build cleanly. Local profile data
       (highlights / notes / bookmarks in IndexedDB / SharedPreferences)
       is intentionally left alone. -->
  <script>
    window.yswordsClearCacheAndReload = async function() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r) {
            return r.unregister().catch(function() {});
          }));
        }
      } catch (e) { console.warn('SW unregister failed:', e); }
      try {
        if (window.caches && caches.keys) {
          const keys = await caches.keys();
          await Promise.all(keys
            // 2026-08-31: `song-media-` is now spared, as the boot-time
            // self-heal above has always spared it. That bucket holds
            // the songs a user DOWNLOADED for offline listening; it has
            // nothing to do with a broken app shell, and wiping it fixes
            // nothing. It mattered less while this ran only on a
            // deliberate tap — it is now also the automatic boot
            // recovery, so silently destroying someone's offline music
            // to repair a shell would be a harm the user never agreed
            // to and would never connect to what they did.
            .filter(function(k) { return k.indexOf('song-media-') !== 0; })
            .map(function(k) {
              return caches.delete(k).catch(function() {});
            }));
        }
      } catch (e) { console.warn('Cache delete failed:', e); }
      try { localStorage.removeItem('yswords_build_stamp'); } catch (_) {}
      try { sessionStorage.removeItem('yswords_self_heal_reloaded'); } catch (_) {}
      // Hard reload from server, bypassing browser disk cache.
      // location.reload(true) is non-standard but still works in
      // Safari/Chrome/Edge/Firefox; falls through to plain reload.
      try {
        location.reload(true);
      } catch (_) {
        location.reload();
      }
    };
  </script>
  <!-- 2026-08-25 (「dev site我加在桌面上就打开一直是白的 webapp」).
       Until now <body> held nothing but scripts, so from first paint
       until Flutter's first frame the page was a blank sheet of colour.
       Measured on an iPhone 17 Pro simulator against yswords-dev, both
       in Safari and as a home-screen web app: a cold first load takes
       over twenty seconds — CanvasKit, main.dart.js and the fonts — and
       shows absolutely nothing for all of it. The app was not broken,
       which is exactly the problem: twenty blank seconds is
       indistinguishable from broken, and in standalone mode there is not
       even a browser progress bar to suggest otherwise. So people wait a
       few seconds, conclude it is dead, and close it.

       Three independent ways to dismiss it, because a splash that
       outlives the app it covers would be far worse than no splash:
         1. `flutter-first-frame`, which the engine dispatches (verified
            present in this build's main.dart.js, not assumed).
         2. A poll for the rendered <flutter-view>/<flt-glass-pane>, in
            case that event ever stops firing.
         3. A hard 90s deadline that removes it no matter what.
       Anything inline, nothing fetched: a loading screen that waits on
       the network is the bug it was written to fix. -->
  <style>
    #ys-boot {
      position: fixed; inset: 0; z-index: 2147483000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #ffffff; color: #0d3b5c;
      font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity .25s ease; text-align: center; padding: 24px;
    }
    #ys-boot.ys-gone { opacity: 0; pointer-events: none; }
    #ys-boot img { width: 76px; height: 76px; border-radius: 18px; }
    #ys-boot .ys-name { font-size: 17px; font-weight: 600; }
    #ys-boot .ys-bar {
      width: 168px; height: 3px; border-radius: 2px;
      background: rgba(13, 59, 92, .15); overflow: hidden;
    }
    #ys-boot .ys-bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #0d3b5c; animation: ys-slide 1.15s ease-in-out infinite;
    }

      0%   { transform: translateX(-110%); }

    #ys-boot .ys-slow { font-size: 13px; opacity: .7; max-width: 300px; }
    #ys-boot .ys-slow a { color: inherit; }
    @media (prefers-color-scheme: dark) {
      #ys-boot { background: #0f1418; color: #dbe7f0; }
      #ys-boot .ys-bar { background: rgba(219, 231, 240, .18); }
      #ys-boot .ys-bar i { background: #dbe7f0; }

  </style>
  <div id="ys-boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" />
    <div class="ys-name">Yahweh's Words</div>
    <div class="ys-bar"><i></i></div>
    <div class="ys-slow" hidden></div>
  </div>
  <script>
    // ONE app name, the reader's own — matching what the Flutter splash
    // does a moment later (see lib/pages/loading_page.dart). Until
    // 2026-08-30 both screens printed the pair "Yahweh's Words 雅伟之言"
    // to everyone; the user asked for the reader's language only.
    //
    // This runs SYNCHRONOUSLY, immediately after the div it edits. The
    // parser has created the element but has not yielded to paint yet, so
    // the swap lands before first paint and there is no flash of the
    // wrong name. That is also why the name is not written by the boot
    // script further down — that one runs later and would flash.
    //
    // The locale comes from the app's OWN stored preference, not from
    // navigator.language, because the two genuinely disagree: measured on
    // the author's machine 2026-08-30, navigator.language was `en-US`
    // while the app was set to zh-Hans. Reading the browser's guess would
    // have shown English here and Chinese one screen later.
    //
    // Two traps in that read, both verified against a live dev build
    // rather than assumed:
    //   * the key is `flutter.locale` (shared_preferences prefixes
    //     everything with `flutter.`);
    //   * the value arrives JSON-encoded, i.e. the literal characters
    //     "zh-Hans" WITH the quotes, so a bare === comparison fails and
    //     silently falls through to the browser guess — which usually
    //     agrees, so it would have looked correct in testing and been
    //     wrong only for the users who changed the app's language.
    //
    // The regional fallback mirrors AppSettings._detectSystemLocale:
    // Chinese splits Hant/Hans, everything else is English.
    (function () {
      function ysAppLocale() {
        try {
          var raw = window.localStorage.getItem('flutter.locale');
          if (raw) {
            var v = raw.replace(/^"|"$/g, '');
            if (v === 'zh-Hans' || v === 'zh-Hant' || v === 'en') return v;
          }
        } catch (e) {
          // private mode, or storage blocked by policy — fall through
        }
        var l = (navigator.language || '').toLowerCase();
        if (l.indexOf('zh') !== 0) return 'en';
        return /hant|[-_](tw|hk|mo)\b/.test(l) ? 'zh-Hant' : 'zh-Hans';
      }
      var NAMES = {
        'zh-Hans': '雅伟之言',
        'zh-Hant': '雅偉之言',
        'en': "Yahweh's Words"
      };
      var name = NAMES[ysAppLocale()] || NAMES.en;
      var el = document.querySelector('#ys-boot .ys-name');
      if (el) el.textContent = name;
      // The tab title carried the same pair. Setting it here rather than
      // in <head> keeps the whole rule in one place; a title updates
      // without a repaint of content, so the ordering costs nothing.
      document.title = name;
    })();
  </script>
  <script>
    (function () {
      var el = document.getElementById('ys-boot');
      if (!el) return;
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        el.classList.add('ys-gone');
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 300);
      }
      // 1. The engine's own signal.
      window.addEventListener('flutter-first-frame', hide);
      // 2. Poll for the rendered view, in case that event changes.
      var poll = setInterval(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          clearInterval(poll);
          hide();
        }
      }, 250);
      // 3. Deadline. A splash must never be the thing hiding a working app.
      setTimeout(function () { clearInterval(poll); hide(); }, 90000);

      // After 15s, say so and offer the escape hatch that already exists
      // for this exact situation, rather than leaving the bar spinning.
      setTimeout(function () {
        if (done) return;
        var slow = el.querySelector('.ys-slow');
        if (!slow) return;
        var zh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
        slow.textContent = zh
          ? '首次打开要下载约 2 MB，网络慢时会久一点。若一直停在这里，'
          : 'The first launch downloads about 2 MB. If it stays here, ';
        var a = document.createElement('a');
        a.href = '#';
        a.textContent = zh ? '清除缓存并重试' : 'clear the cache and retry';
        a.addEventListener('click', function (e) {
          e.preventDefault();
          if (window.yswordsClearCacheAndReload) {
            window.yswordsClearCacheAndReload();
          } else {
            location.reload();
          }
        });
        slow.appendChild(a);
        slow.hidden = false;
      }, 15000);

      // ── Automatic recovery ────────────────────────────────────────
      //
      // 2026-08-31, from the user with a screenshot of a phone parked on
      // this splash, the link circled in red: 「even some people don't
      // know they need to click here」. Quite right — a recovery that
      // only works for people who recognise an underlined phrase as a
      // repair tool is not a recovery. Most people read a stuck screen
      // as a broken app and close it.
      //
      // So the page now does it itself. The whole difficulty is telling
      // STUCK apart from SLOW, because reloading a slow load makes it
      // strictly worse: it aborts an in-flight main.dart.js and throws
      // away every byte already fetched, so the next attempt starts from
      // zero and hits the same wall. That is a loop the app can never
      // escape, and the slower the connection the worse it gets — the
      // same pathology `clear_cache_helper_web.dart`'s boot-recovery
      // latch was written for, one layer further out.
      //
      // The discriminator is main.dart.js's own resource timing:
      //
      //   • still downloading → NO entry yet → slow, hands off. This is
      //     the case that must never be touched, and it is the common
      //     one: on a phone the bundle is ~10 MB.
      //   • finished, and still no Flutter view seconds later → the
      //     bytes arrived and did not run. That is stuck, and a reload
      //     costs nothing because there is no transfer to interrupt.
      //   • an uncaught script error → stuck, immediately.
      //
      // Plus a once-per-tab-session latch, so a page that cannot be
      // fixed this way is left alone after one attempt rather than
      // reloading forever.
      var LATCH = 'yswords.bootAutoRecovered';
      var sawScriptError = false;
      var bundleScriptFailed = false;
      window.addEventListener('error', function (e) {
        if (!e) return;
        var t = e.target;
        if (t && t !== window && t.tagName) {
          // A RESOURCE failed to load. Only a script can stop the app
          // starting — a missing image or font says nothing about
          // whether the shell can run, and treating one as evidence
          // would let an unrelated 404 abort a download in flight.
          if (String(t.tagName).toUpperCase() !== 'SCRIPT') return;
          var src = String(t.src || '');
          if (src.indexOf('main.dart.js') !== -1 ||
              src.indexOf('flutter_bootstrap.js') !== -1) {
            // The bundle itself could not be fetched. There is no
            // transfer left to interrupt, so this is the one signal
            // allowed to act while nothing has finished downloading.
            bundleScriptFailed = true;
          } else {
            sawScriptError = true;
          }
          return;
        }
        // An uncaught exception. Something ran and threw.
        if (e.message) sawScriptError = true;
      }, true);

      // Pure decision, kept as a named function on purpose: it is
      // extracted and exercised by tools/check_boot_autorecover.js, so
      // the rules that decide whether to throw away someone's in-flight
      // download are tested rather than eyeballed.
      function ysShouldAutoRecover(s) {
        // Booted. Nothing to recover.
        if (s.booted) return false;
        // One attempt per tab session, whatever happens.
        if (s.alreadyTried) return false;
        // Never before this floor, no matter what the signals say — a
        // cold first load on a slow phone legitimately takes this long.
        if (s.elapsedMs < 20000) return false;
        // The bundle could not be fetched at all. Nothing is in flight,
        // so this is the only signal allowed past the guard below.
        if (s.bundleScriptFailed) return true;
        // THE GUARD. No entry for main.dart.js means it is still on its
        // way, and reloading now would abort it and discard every byte
        // already fetched — each retry starting from zero and hitting
        // the same wall, worse the slower the link. Whatever else is
        // true, a download in progress is left alone.
        if (s.mainBundleDoneMs === null) return false;
        // Past here the bundle has arrived, so a reload costs no
        // transfer. It either threw…
        if (s.sawScriptError) return true;
        // …or it simply never painted.
        if (s.elapsedMs - s.mainBundleDoneMs >= 12000) return true;
        return false;
      }

      function ysMainBundleDoneMs() {
        try {
          var entries = performance.getEntriesByType('resource');
          for (var i = 0; i < entries.length; i++) {
            var n = entries[i].name || '';
            if (n.indexOf('main.dart.js') !== -1 && entries[i].responseEnd > 0) {
              return entries[i].responseEnd;
            }
          }
        } catch (_) {}
        return null;
      }

      function ysAlreadyRecovered() {
        try {
          return sessionStorage.getItem(LATCH) !== null;
        } catch (_) {
          // Private-mode Safari throws on storage access. Fail CLOSED:
          // report "already tried", so a browser that cannot hold the
          // latch never auto-reloads rather than risking the loop. The
          // manual link is still there.
          return true;
        }
      }

      var recoverPoll = setInterval(function () {
        if (done) { clearInterval(recoverPoll); return; }
        if (!ysShouldAutoRecover({
              booted: done,
              alreadyTried: ysAlreadyRecovered(),
              elapsedMs: performance.now(),
              sawScriptError: sawScriptError,
              bundleScriptFailed: bundleScriptFailed,
              mainBundleDoneMs: ysMainBundleDoneMs()
            })) {
          return;
        }
        clearInterval(recoverPoll);
        try { sessionStorage.setItem(LATCH, '1'); } catch (_) {}
        var slow = el.querySelector('.ys-slow');
        if (slow) {
          var zh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
          slow.textContent = zh ? '正在自动修复…' : 'Repairing automatically…';
          slow.hidden = false;
        }
        // Give the message a frame to paint before the page goes away,
        // so a reload that does not help still leaves the user knowing
        // the app tried something rather than having merely blinked.
        setTimeout(function () {
          if (window.yswordsClearCacheAndReload) {
            window.yswordsClearCacheAndReload();
          } else {
            location.reload();
          }
        }, 400);
      }, 1000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
