# Weekly refresh of the bundled song-catalogue snapshot.
#
# 2026-08-09: this used to re-run scripts/sync_songs.py, scraping all
# four church sites a SECOND time — independently of the run that
# produced the published dataset on yswords-data. That doubled the
# traffic we put on small church servers (fydt.org stopped answering
# entirely mid-session once), and let the bundled snapshot drift from
# what the app fetches at runtime whenever a site was briefly down
# during one of the two runs.
#
# yswords-data is now the source of truth: it validates against a JSON
# Schema and runs its own tests before publishing, and its own
# refresh-songs workflow does the scraping. This job just pulls the
# published result.
#
# The bundle still matters even though the app fetches at runtime — it
# is what a user sees offline, behind the GFW, or on first launch
# before any fetch has completed.
#
# Manual run: Actions → Sync songs → Run workflow.

name: Sync songs

on:
  schedule:
    # Mondays 02:00 UTC — after yswords-data's Sunday 18:00 sync has
    # published, so this picks up the same week's catalogue rather
    # than the previous one.
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Refuses to write a catalogue that is too small or missing a
      # source, so a bad publish upstream cannot become a broken
      # offline experience down here.
      - name: Pull published snapshot
        run: python3 scripts/pull_songs_snapshot.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- assets/songs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- assets/songs.json
          fi

      - name: Commit + push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'yswords-songs-sync'
          git config user.email 'noreply@yswords.netlify.app'
          git add assets/songs.json
          git commit -m "chore(songs): refresh bundled snapshot from yswords-data

          Auto-generated by .github/workflows/sync-songs.yml.
          Source: https://yswords-data.netlify.app/data/songs.json"
          git push
