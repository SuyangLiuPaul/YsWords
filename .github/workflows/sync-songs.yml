# Weekly cron that re-scrapes the church songs index and refreshes
# assets/songs.json with any new entries. Only metadata is captured
# (title, source URL, audio/PDF URLs, language, theme tags from
# title keywords) — no lyrics or song body text.
#
# When the script reports a change, this workflow auto-commits to
# main so the next Netlify deploy picks it up.
#
# Manual run: Actions → Sync songs → Run workflow.

name: Sync songs

on:
  schedule:
    # Sundays 18:00 UTC ≈ Monday 02:00 / 04:00 in HK / Sydney —
    # off-peak for both upstream sites.
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync script
        id: sync
        run: |
          set +e
          python3 scripts/sync_songs.py
          code=$?
          # Convention: 0 = no change, 1 = file updated, anything else = error.
          if [ $code -eq 0 ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          elif [ $code -eq 1 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            exit $code
          fi

      - name: Commit + push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'yswords-songs-sync'
          git config user.email 'noreply@yswords.netlify.app'
          git add assets/songs.json
          git commit -m "chore(songs): weekly sync from upstream catalogue

          Auto-generated by .github/workflows/sync-songs.yml.
          Pulls new entries from fydt.org/xinge sitemap and
          christiandiscipleschurch.org/integrated-list-songs index.
          Metadata only — no lyrics or content reproduced."
          git push
