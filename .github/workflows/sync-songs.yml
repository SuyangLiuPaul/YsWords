# Weekly refresh of assets/songs.json from the three church song
# catalogues (fydt.org via its fydt-api/v1 JSON API,
# cahayapengharapan.org, christiandiscipleschurch.org).
#
# Metadata + media URLs only — titles, credits, theme tags, and links
# to audio/video/PDFs that stay on each church's own servers. The one
# exception is fydt's lyrics, which its API publishes as a field and
# which the pastors who run the site approved us carrying.
#
# 2026-08-09: the previous version of this workflow keyed "did
# anything change?" off the script's EXIT CODE (0 = no change,
# 1 = updated). The rewritten script uses exit 1 for a real failure
# — a dead upstream, or --verify finding rotted links — so change
# detection now goes through `git diff` and a non-zero exit correctly
# fails the run instead of being read as "there were updates".
#
# Manual run: Actions → Sync songs → Run workflow.

name: Sync songs

on:
  schedule:
    # Sundays 18:00 UTC ≈ Monday 02:00 / 04:00 in HK / Sydney —
    # off-peak for all three upstream sites.
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --verify HEAD-checks every media URL afterwards. The Songs
      # feature was deleted once already because links rotted without
      # anyone noticing, so a broken catalogue should fail loudly here
      # rather than reach users.
      - name: Sync catalogue
        run: python3 scripts/sync_songs.py --verify

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- assets/songs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- assets/songs.json
          fi

      - name: Commit + push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'yswords-songs-sync'
          git config user.email 'noreply@yswords.netlify.app'
          git add assets/songs.json
          git commit -m "chore(songs): weekly sync from upstream catalogues

          Auto-generated by .github/workflows/sync-songs.yml.
          Sources: fydt.org (fydt-api/v1), cahayapengharapan.org,
          christiandiscipleschurch.org. Metadata + media URLs;
          media itself stays on the source servers."
          git push
