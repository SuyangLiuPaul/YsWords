name: Build native packages

# Builds native installers (currently Android APK in two flavours) and
# attaches them to the matching GitHub release.
#
# Triggered automatically when a `v*` tag is pushed (so cutting a new
# tag → APKs appear on the release page within ~5 min). Can also be
# triggered manually via workflow_dispatch with a tag input — useful
# for backfilling APKs to existing releases without bumping the
# version.
#
# Why this lives in a workflow vs the local `tools/deploy_site.py`:
# native APK builds need an Android SDK + JDK + Flutter SDK installed,
# which is heavy to install locally. GitHub-hosted runners come with
# all of it pre-staged, so each build is < 5 min and the dev's local
# machine doesn't need any extra toolchain.
#
# Future expansion: macOS / Windows / Linux desktop builds + iOS (the
# last requires an Apple Developer Program subscription so it's
# deferred). When you add them: copy the `android` job, swap `runs-on`
# to the right runner, and use the matching `flutter build` command.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to attach builds to (e.g. v1.2.6).
          The workflow expects a release with this tag to already
          exist on GitHub — it uploads the APK as an asset.
        required: true
        default: 'v1.2.6'

permissions:
  contents: write  # needed for the action-gh-release upload step

jobs:
  android:
    name: Android APK (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    strategy:
      # Two parallel builds: the international flavour points at the
      # default yswords.netlify.app backend; the China-mode flavour
      # points at yswords-cn.netlify.app and sets `kChinaMode=true`.
      # Both share the same Bible-text + sermon assets bundled in the
      # APK; only the network endpoints + a few UI gates differ.
      fail-fast: false
      matrix:
        include:
          - flavour: intl
            backend: https://yswords.netlify.app
          - flavour: cn
            backend: https://yswords-cn.netlify.app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the dev develops against. Bump in
          # lockstep with `pubspec.yaml`'s `environment: sdk:` floor.
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Resolve the release tag once so subsequent steps can reuse it.
      # On tag push, github.ref_name is the tag itself (e.g.
      # "v1.2.6"). On manual dispatch, github.event.inputs.tag carries
      # the tag the dev typed into the form.
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: native APKs currently build with `kChinaMode=true` on
      # BOTH flavours. This is a deliberate MVP simplification — it
      # lets us skip Firebase init at boot (no `google-services.json`
      # checked in, no Apple-Cloud-Messaging certs, no per-platform
      # Firebase config) without a graceful-fallback code path. The
      # cost is that the About-page footer says "China build" on the
      # intl APK too. To untangle: introduce a separate
      # `--dart-define=NATIVE_BUILD=true` flag in build_flags.dart
      # that gates Firebase init independently of the China-mode
      # label. Tracked for v1.2.8.
      - name: Build APK (${{ matrix.flavour }})
        run: |
          flutter build apk --release \
            --dart-define=CHINA_MODE=true \
            --dart-define=AI_BIBLE_SEARCH_URL=${{ matrix.backend }}/api/aiBibleSearch \
            --dart-define=AI_SEARCH_URL=${{ matrix.backend }}/api/aiSearch \
            --dart-define=AI_EXPLAIN_WORD_URL=${{ matrix.backend }}/api/aiExplainWord \
            --dart-define=FEEDBACK_URL=${{ matrix.backend }}/api/submitFeedback

      - name: Rename + checksum APK
        run: |
          OUT=yswords-android-${{ matrix.flavour }}-${{ steps.tag.outputs.tag }}.apk
          mv build/app/outputs/flutter-apk/app-release.apk "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          ls -la "$OUT" "$OUT.sha256"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            yswords-android-${{ matrix.flavour }}-${{ steps.tag.outputs.tag }}.apk
            yswords-android-${{ matrix.flavour }}-${{ steps.tag.outputs.tag }}.apk.sha256
          fail_on_unmatched_files: true
