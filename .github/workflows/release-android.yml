# YsWords — Android release build
#
# Builds the release APK on a GitHub-hosted ubuntu-latest runner and
# publishes it as a downloadable release asset. Mirrors
# release-windows.yml so the release set stays consistent.
#
# Flavor: builds the `intl` flavor (applicationId com.example.yswords)
# — the same flavor installed on the user's phones / Mi Pad. The `cn`
# flavor (applicationIdSuffix .cn) is intentionally not built here.
#
# Signing: the real release key, from repository secrets
# (ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD), written to
# android/key.properties before the build. Before 2026-09-09 this
# job used a per-run debug key, so no release could install over
# the previous one. There is no debug fallback: if the secret is
# missing the job fails.
#
# Triggers
#   * push of a version tag  v*   → build, attach the APK to that tag's
#     GitHub Release (creating it if absent).
#   * workflow_dispatch (manual) → always uploads the APK as a workflow
#     *artifact*; type an existing tag to also attach it to that
#     release, or leave blank for a safe test build.
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to (blank = test build, artifact only, no release touched)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Android Gradle Plugin needs a JDK; flutter-action doesn't set
      # one up. Temurin 17 matches the local toolchain (openjdk@17).
      - name: Setup Java (JDK 17)
        # v5 runs on Node 24 — v4 ran on Node 20, which GitHub deprecated
        # (the runner warns and will force Node 24 from 2026-06-16).
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        # Pinned to a commit, not the movable v2 tag: this job now holds the
        # release signing key, so a compromised tag would be a key leak.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'   # keep in step with flutter-ci.yml
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      # flutter/flutter#191801 - with product flavors, Gradle's jniLib
      # merge stays "up-to-date" while its input is rewritten, so the APK
      # ships a new version string over OLD Dart code. The rule lives in
      # tools/clear_stuck_jnilib_merge.sh; this is the call site.
      #
      # HONESTY NOTE, measured 2026-09-06: this runner is structurally
      # IMMUNE. `actions/checkout` gives a fresh tree and nothing here
      # caches build/ or ~/.gradle (subosito/flutter-action's `cache:` is
      # the SDK, not the project), so there is no previous merge output
      # for the task to be up-to-date against. Both released APKs were
      # verified fresh - every lib/*/libapp.so carried its own tag's
      # kAppReleaseTime and not the previous release's.
      #
      # So do NOT read a green run of this workflow as evidence that the
      # workaround works. It is insurance against someone adding a Gradle
      # cache here later, and it keeps every APK-producing path uniform
      # so the coverage guard test can enumerate them. It costs ~0 and
      # prints "nothing to clear".
      - name: Clear stale Gradle jniLib merge outputs (flutter/flutter#191801)
        run: tools/clear_stuck_jnilib_merge.sh "$GITHUB_WORKSPACE"

      # SIGNING (2026-09-09). Until today this job fell through to
      # `signingConfigs.getByName("debug")` in android/app/build.gradle.kts,
      # and a GitHub runner has no ~/.android/debug.keystore, so the Android
      # Gradle plugin GENERATED ONE PER RUN. Measured on the shipped assets:
      # v1.5.20 and v1.5.21 carry different signing
      # certificates. Android replaces an installed package only when the
      # new APK is signed by the same certificate, so every release was
      # un-installable over the one before it — the in-app updater added
      # today would download ~200 MB and end at "App not installed".
      # The real release key now comes from repository secrets. There is
      # deliberately NO fallback: a tag build that cannot sign must FAIL
      # rather than publish another un-installable APK.
      - name: Write signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Release APKs must be signed with the real release key; refusing to fall back to a debug key (see the comment above this step)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # Never echo the values; key.properties is written, not printed.
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Wrote android/key.properties ($(wc -c < "$RUNNER_TEMP/release.keystore") byte keystore)."

      - name: Build APK (release, intl flavor)
        run: flutter build apk --release --flavor intl

      # The failure this replaced was invisible for months because nothing
      # ever looked at the certificate. Now the job does, and prints the
      # digest so a future release can be compared against this one.
      - name: Verify the APK is signed with the release key
        run: |
          APK="build/app/outputs/flutter-apk/app-intl-release.apk"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt

          # The label differs by build-tools version: older ones print
          # "Signer #1 certificate SHA-256 digest:", 37.0.0 prints
          # "V2 Signer: certificate SHA-256 digest:". Matching on the
          # part they share is what makes this survive a bump. The
          # first version of this step matched only the older label,
          # printed an EMPTY digest for v1.6.272 / v1.5.22, and passed
          # anyway — a guard that reports nothing and succeeds is worse
          # than no guard, which is why the empty case is now fatal.
          got="$(grep -m1 -iE 'certificate SHA-256 digest' /tmp/certs.txt \
                 | awk '{print $NF}' | tr 'A-Z' 'a-z')"
          echo "signing cert SHA-256: ${got:-<none>}"
          if [ -z "$got" ]; then
            echo "::error::Could not read the signing certificate digest from apksigner. Refusing to publish an APK whose signature was never actually checked."
            exit 1
          fi

          # A debug key is the failure this whole step exists for: it
          # makes the APK refuse to install over any build signed with
          # the real key (INSTALL_FAILED_UPDATE_INCOMPATIBLE, which
          # readers see as the useless "App not installed").
          if grep -qi 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::This APK is signed with a DEBUG certificate. It cannot update any installed build."
            exit 1
          fi

          # And the positive check. "Not obviously a debug key" is not
          # the same as "our key": a keystore secret replaced by mistake
          # would pass every test above and still ship an APK no reader
          # could install over theirs. vars.ANDROID_CERT_SHA256 is the
          # fingerprint recorded in the keystore backup notes; it is
          # public (it ships inside every APK), so it is a variable
          # rather than a secret and can be printed on failure.
          want="$(echo "${{ vars.ANDROID_CERT_SHA256 }}" | tr -d ': ' | tr 'A-Z' 'a-z')"
          if [ -z "$want" ]; then
            echo "::warning::vars.ANDROID_CERT_SHA256 is not set, so the digest was not compared against the expected release key."
          elif [ "$got" != "$want" ]; then
            echo "::error::Signing certificate is not the expected release key."
            echo "::error::  got:  $got"
            echo "::error::  want: $want"
            exit 1
          else
            echo "✓ matches the expected release certificate"
          fi

      - name: Resolve tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage APK
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          [ -z "$tag" ] && tag="dev-${GITHUB_SHA::7}"
          src="build/app/outputs/flutter-apk/app-intl-release.apk"
          pkg="YsWords-Android-${tag}.apk"
          cp "$src" "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "Staged $pkg ($(du -h "$pkg" | cut -f1))"

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: YsWords-Android
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          # 2026-09-09 review finding: the old `view || create` ran on BOTH
          # trigger paths, so a manual run typed with a tag that did not
          # exist silently minted that tag on the dispatched ref (main HEAD)
          # plus a Release — and releases/latest, which the in-app
          # UpdateService polls, then pointed every user at an unreviewed
          # build. Manual runs may only ATTACH to a release that already
          # exists; only the tag-push path may create one (there the tag is
          # already pinned to a reviewed commit by tools/release_github.sh).
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Release '$tag' does not exist. A manual run only attaches to an existing release; to cut a new one push the tag (tools/release_github.sh) instead. The build is still available above as a workflow artifact."
              exit 1
            fi
            gh release create "$tag" \
              --title "$tag" \
              --notes "Automated Android build (intl flavor, signed with the project release key — sideload only, not a Play Store build). Download the .apk, enable 'Install unknown apps' for your browser/file manager, and open it to install. ⚠️ If you installed a build from GitHub before 2026-09-09, uninstall it once before installing this one: those builds were signed with a throwaway debug key, and Android refuses to install over a different certificate (it shows only “App not installed”). After that one reinstall, updates work normally. / ⚠️ 如果你在 2026-09-09 之前从 GitHub 装过，请先卸载再装这个版本：旧包用的是临时调试密钥，证书不同时 Android 会拒绝覆盖安装（只显示「应用未安装」）。重装一次之后，以后的更新都能正常覆盖。" \
              || true
          fi
          gh release upload "$tag" "$PKG" --clobber
