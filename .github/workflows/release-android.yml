# YsWords — Android release build
#
# Builds the release APK on a GitHub-hosted ubuntu-latest runner and
# publishes it as a downloadable release asset. Mirrors
# release-windows.yml so the release set stays consistent.
#
# Flavor: builds the `intl` flavor (applicationId com.example.yswords)
# — the same flavor installed on the user's phones / Mi Pad. The `cn`
# flavor (applicationIdSuffix .cn) is intentionally not built here.
#
# Signing: android/app/build.gradle.kts signs the release build with
# the DEBUG keystore, so no signing secret is needed — the APK is
# sideload-installable but is NOT a Play-Store upload artifact.
#
# Triggers
#   * push of a version tag  v*   → build, attach the APK to that tag's
#     GitHub Release (creating it if absent).
#   * workflow_dispatch (manual) → always uploads the APK as a workflow
#     *artifact*; type an existing tag to also attach it to that
#     release, or leave blank for a safe test build.
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to (blank = test build, artifact only, no release touched)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Android Gradle Plugin needs a JDK; flutter-action doesn't set
      # one up. Temurin 17 matches the local toolchain (openjdk@17).
      - name: Setup Java (JDK 17)
        # v5 runs on Node 24 — v4 ran on Node 20, which GitHub deprecated
        # (the runner warns and will force Node 24 from 2026-06-16).
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'   # keep in step with flutter-ci.yml
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      # flutter/flutter#191801 - with product flavors, Gradle's jniLib
      # merge stays "up-to-date" while its input is rewritten, so the APK
      # ships a new version string over OLD Dart code. The rule lives in
      # tools/clear_stuck_jnilib_merge.sh; this is the call site.
      #
      # HONESTY NOTE, measured 2026-09-06: this runner is structurally
      # IMMUNE. `actions/checkout` gives a fresh tree and nothing here
      # caches build/ or ~/.gradle (subosito/flutter-action's `cache:` is
      # the SDK, not the project), so there is no previous merge output
      # for the task to be up-to-date against. Both released APKs were
      # verified fresh - every lib/*/libapp.so carried its own tag's
      # kAppReleaseTime and not the previous release's.
      #
      # So do NOT read a green run of this workflow as evidence that the
      # workaround works. It is insurance against someone adding a Gradle
      # cache here later, and it keeps every APK-producing path uniform
      # so the coverage guard test can enumerate them. It costs ~0 and
      # prints "nothing to clear".
      - name: Clear stale Gradle jniLib merge outputs (flutter/flutter#191801)
        run: tools/clear_stuck_jnilib_merge.sh "$GITHUB_WORKSPACE"

      - name: Build APK (release, intl flavor)
        run: flutter build apk --release --flavor intl

      - name: Resolve tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage APK
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          [ -z "$tag" ] && tag="dev-${GITHUB_SHA::7}"
          src="build/app/outputs/flutter-apk/app-intl-release.apk"
          pkg="YsWords-Android-${tag}.apk"
          cp "$src" "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "Staged $pkg ($(du -h "$pkg" | cut -f1))"

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: YsWords-Android
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "$tag" \
              --notes "Automated Android build (intl flavor, debug-signed APK — sideload only, not a Play Store build). Download the .apk, enable 'Install unknown apps' for your browser/file manager, and open it to install." \
              || true
          gh release upload "$tag" "$PKG" --clobber
