[build]
  command = "echo 'Flutter web pre-built'"
  publish = "build/web"

# Netlify Functions for the AI-search Gemini proxy. Source lives in
# `netlify/functions/`; the function URL is exposed at
# `/.netlify/functions/aiSearch` and (via the explicit `path` config
# inside the function) also at `/api/aiSearch`.
#
# `included_files` ships `assets/bible_evidence.json` inside the
# function bundle so the prompt builder can read it without a
# network roundtrip on every invocation.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["assets/bible_evidence.json"]

# Static-file SPA fallback. The Netlify Function URLs (`/api/*` and
# `/.netlify/functions/*`) are matched and served by Netlify BEFORE
# this catch-all rewrite, so the function doesn't get swallowed by
# the SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Force browsers to revalidate the entry files on every load. Without
# these headers, Flutter's service worker happily served users a stale
# main.dart.js for hours/days after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 2026-07-23 (v1.3.143): same class of bug as the entry-file headers
# above, one layer deeper. main.dart.js reads these two manifest
# files immediately at boot to resolve bundled assets/fonts, but
# they had no explicit header — so they fell back to Netlify's
# default (longer) caching while main.dart.js above is forced fresh
# on every load. A browser holding a stale cached manifest against a
# freshly-deployed main.dart.js is exactly "Unable to load asset:
# AssetManifest.bin.json" (reported in prod right after a deploy).
[[headers]]
  for = "/assets/AssetManifest.bin.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/FontManifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 2026-05-24 (v1.3.24): security headers applied to every response.
# Documented per-header so future agents know why each entry exists.
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS — tell the browser to ONLY connect via HTTPS for the next
    # 2 years, applying to subdomains. `preload` opts into the
    # browser-vendor HSTS preload list (https://hstspreload.org). Once
    # preloaded the user's first-ever visit is HTTPS-only.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # 2026-05-24 (v1.3.29 hotfix): CSP REMOVED.
    #
    # The v1.3.24 → v1.3.28 attempts at a tight CSP repeatedly broke
    # real functionality because Flutter web + Firebase + Google
    # Sign-In + the google_fonts package touch many hosts at runtime
    # and through unusual channels (XHR for fonts that traditionally
    # used `<link>`, popups for OAuth, iframes for token refresh,
    # blob: URLs for workers). The whack-a-mole hotfix loop kept
    # missing one host or another:
    #   * v1.3.24: shipped CSP — broke CanvasKit (gstatic.com)
    #   * v1.3.27 hotfix: added gstatic.com → fonts garbled
    #   * v1.3.28 hotfix: added fonts.* → AI / Firebase / Google
    #     Sign-In broken
    #
    # The other security headers below (HSTS, X-Frame-Options,
    # X-Content-Type-Options, Referrer-Policy, Permissions-Policy,
    # COOP) all stay — none of them have host-allowlist issues, all
    # provide real defense-in-depth value, none of them are at risk
    # of breaking functionality.
    #
    # Re-adding CSP is on the priorities.md "Security baseline →
    # remaining" list. The right approach next time: deploy a
    # `Content-Security-Policy-Report-Only` header first, run the
    # app through a full user-flow capture (sign-in, version
    # switch, AI search, daily verse fetch, evidence images,
    # bookmarks, notes, exegesis, install prompt), collect all
    # `csp-report` violations, then enumerate the actual hosts.
    # NOT another guess-and-break round.

    # X-Frame-Options: legacy companion to CSP `frame-ancestors`.
    # Older browsers honour this but not frame-ancestors; keep both.
    X-Frame-Options = "DENY"

    # Block MIME-type sniffing — protects against an attacker
    # uploading something with a fake content-type and having the
    # browser execute it as a script.
    X-Content-Type-Options = "nosniff"

    # Referrer-Policy — limit what the Referer header reveals to
    # cross-origin destinations. `strict-origin-when-cross-origin`
    # sends full URL same-origin, origin only cross-origin, nothing
    # on downgrade (HTTPS→HTTP).
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions-Policy — explicitly deny powerful features we
    # don't use. If a future bundle/dep adds geolocation / camera /
    # etc. without an exception here, the browser refuses.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

    # Cross-Origin-Opener-Policy — isolate this origin so OAuth
    # popups (Firebase sign-in) and other window.opener references
    # are sandboxed. `same-origin-allow-popups` keeps Firebase's
    # signInWithPopup working.
    #
    # 2026-07-20: this value (plus the absence of a
    # Cross-Origin-Embedder-Policy header) means `window.
    # crossOriginIsolated` is false on every deployed site —
    # verified directly in prod. That blocked multi-threaded skwasm
    # (Flutter's WebAssembly renderer): it silently fell back to
    # single-threaded mode, which put enough extra main-thread
    # contention on cold boot (Skia init + the ~6-8 MB Bible-JSON
    # decode competing for one thread) to intermittently blow the
    # FetchVerses 20 s first-attempt timeout — "Failed to load, then
    # works after retrying" was the exact user-visible symptom.
    # Reverted to canvaskit (v1.3.132) rather than loosen this
    # header, since strict `same-origin` COOP breaks
    # signInWithPopup's window.opener relationship. Don't re-attempt
    # skwasm without first moving Google Sign-In to a redirect-based
    # flow (no window.opener dependency) so COOP can go strict and
    # COEP can be added without breaking auth.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
