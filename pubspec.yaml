name: yswords
description: "YsWords means Yahweh's words. A bilingual Bible app to help you listen to His voice and abide in Him daily."
publish_to: 'none'
version: 1.3.144

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  provider: ^6.1.1
  scroll_to_index: ^3.0.1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.2
  # Cloud sync (optional — see lib/firebase_options.dart for setup).
  #
  # IMPORTANT: keep firebase_core / _auth / cloud_firestore on the
  # SAME major-version family. firebase_core 3.x + 4.x had a known
  # transitive resolution bug where pub picked
  # firebase_core_platform_interface 6.x (Pigeon-based) alongside
  # firebase_core_web 2.x (no Pigeon handler) → every initializeApp
  # call threw `PlatformException(channel-error, ...
  # FirebaseCoreHostApi.initializeCore)`. firebase_core ^4.0.0 pulls
  # in firebase_core_web 3.x which implements the Pigeon receiver,
  # fixing the channel-error. Bump these together.
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  # 2026-05-06: Realtime Database replaces the previous Drive sync.
  # Different transport from Firestore (WebSocket vs WebChannel) and
  # generally more reliable on web; doesn't require any extra OAuth
  # scope at sign-in (Firebase Auth + email/profile scopes is enough).
  firebase_database: ^12.0.0
  # Used by AiSearchService to call the Cloud Functions Gemini proxy.
  http: ^1.2.2
  # 2026-05-21 (v1.2.69): native notifications on iOS / Android /
  # macOS. Web continues to use the browser Notification API via
  # notification_service_web.dart. Plugin handles UNUserNotification
  # permission flow on Apple platforms and POST_NOTIFICATIONS on
  # Android 13+.
  flutter_local_notifications: ^19.0.0
  # 2026-05-22 (v1.2.71): native Google sign-in on macOS. The
  # firebase_auth `signInWithProvider` is hard-coded to return null
  # on macOS (FLTFirebaseAuthPlugin.m line 1701 explicitly:
  # `signInWithProvider is not supported on the MacOS platform`).
  # google_sign_in produces an ID token natively via GIDSignIn, which
  # we then exchange for a Firebase credential via signInWithCredential.
  # Only used on macOS — iOS / Android keep using signInWithProvider,
  # web keeps signInWithPopup. Mobile/web also have working flows.
  google_sign_in: ^6.2.1
  # Round 56: dynamically loads Google Fonts at runtime so the
  # font picker's English serif / sans-serif options actually
  # render. Without this, only the two bundled fonts (Roboto +
  # Microsoft YaHei) work — picking "EB Garamond", "Lora",
  # "Merriweather" etc. silently fell back to Roboto on web
  # (CanvasKit can't pull from system fonts).
  google_fonts: ^6.2.1
  # 2026-05-24 (v1.3.19): audioplayers removed with the 朗读 feature.
  # 2026-05-24 (v1.3.0): notification scheduler. flutter_local_notifications
  # requires `tz.TZDateTime` for `zonedSchedule`. flutter_timezone gets the
  # device's IANA timezone (e.g. "Australia/Melbourne") at startup so
  # tz.local resolves correctly — without this tz.local defaults to UTC
  # and a notification scheduled at "09:00 local" fires at 09:00 UTC.
  timezone: ^0.10.0
  # 2026-07-20: ^4.0.0 → ^5.1.0. v4.1.1's flutter_timezone_web.dart had
  # an invalid js-interop runtime cast that failed the wasm dry-run and
  # blocked `flutter build web --wasm` (skwasm renderer). The plugin
  # never actually runs on web (notification_scheduler.dart early-
  # returns on kIsWeb) — it only needed to *compile* cleanly to wasm.
  flutter_timezone: ^5.1.0
  # 2026-05-24 (v1.2.97): web favicon swap. AppIconServiceWeb uses
  # the modern package:web DOM bindings (not dart:html) to mutate
  # <link rel="icon"> when the user changes primaryColor. Already
  # pulled transitively by Flutter web, but listed explicitly so
  # the analyzer's `depend_on_referenced_packages` lint stops
  # complaining about a direct import without a direct dep.
  web: ^1.0.0
  # 2026-05-24 (v1.3.19): path_provider + crypto were originally
  # added for the TTS audio cache (now removed). Keeping them around
  # — path_provider has other potential uses (offline asset cache,
  # debug log writes) and the binary footprint is negligible.
  # crypto is the same. Drop in a future cleanup if neither gets a
  # second consumer.
  path_provider: ^2.1.4
  crypto: ^3.0.5
  # 2026-05-24 (v1.3.19): flutter_tts removed with the 朗读 feature.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/kjv.json
    - assets/leb.json
    - assets/cuvs-yhwh.json
    - assets/cuvs-yhwh-tr.json
    - assets/biblexg.json
    - assets/biblexg-tr.json
    - assets/biblexg-v2.json
    - assets/biblexg-v2-tr.json
    - assets/cuv.json
    - assets/cuv-tr.json
    - assets/cnv.json
    - assets/cnv-tr.json
    - assets/nasb.json
    # NIV (Biblica/Zondervan) removed in 2026-05 — its complete text
    # cannot be redistributed without a publisher licence.
    - assets/web-ot-paragraphs.json
    - assets/app_icon.png
    - assets/loading.png
    - assets/fonts/
    - assets/maps/
    - assets/maps_index.json
    - assets/cross_references.json
    - assets/section_titles.json
    - assets/book_introductions.json
    - assets/gospel_synopsis.json
    - assets/daily_verses.json
    - assets/bible_evidence.json
    - assets/strongs/
    - assets/originals/
    - assets/sermons/index.json
    - assets/sermons/refs.json
    - assets/family_tree.json
    - assets/bible_timeline.json
    - assets/sermons/en/
    - assets/sermons/zh-CN/
    - assets/sermons/zh-TW/
    # 2026-05-24 (v1.2.97): themed app-icon PNGs. Used by Dart side
    # to swap the macOS Dock icon at runtime (rootBundle.load → bytes
    # → MethodChannel → NSImage(data:) → NSApplication.applicationIconImage).
    # iOS / Android / Web use platform-native paths (loose PNGs at
    # ios/Runner/, mipmap-*/ic_launcher_<v>.png, web/icons/Icon-<V>-*.png).
    - assets/themed_icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf
    # 2026-05-24 (v1.3.31): bundled Noto Sans CJK SC subset covering
    # every CJK character used anywhere in the app — Bible text
    # (CUVS-YHWH, CNV, CUV, BIBLEXG variants), section titles, book
    # introductions, Strong's lexicons, sermons, family-tree names,
    # songs, evidence, and UI strings. Subsetted with pyftsubset from
    # the official Noto Sans CJK SC Regular OTF (SIL OFL, freely
    # redistributable). Source: https://github.com/notofonts/noto-cjk
    #
    # WHY: Flutter web's CanvasKit renderer ONLY uses fonts registered
    # in its Skia font registry. The `kCjkFontFallback` chain in
    # `lib/utils/font_catalog.dart` lists CSS font names (PingFang SC,
    # Microsoft YaHei, …) that CanvasKit cannot resolve unless those
    # fonts are physically loaded. Without a bundled CJK font, rare
    # characters like `赒` (Acts 10:2 in CUVS-YHWH), `䍁`, and the
    # Ext-B char `𨱔` rendered as "X" tofu glyphs because the bundled
    # Roboto has no CJK coverage. The google_fonts package downloads
    # Noto Sans SC at runtime if the user picks it as their primary
    # font, but did NOT cover the fallback case where the user kept
    # an English primary font + the verse contained CJK.
    #
    # The subset is built from `assets/*.json` + `lib/**/*.dart` +
    # `assets/sermons/*.txt` and gives ~1.88 MB OTF (down from the
    # 16 MB full Noto Sans CJK SC). Regenerate with:
    #   tools/build_cjk_font_subset.sh
    #
    # The family name is `NotoSansSC-YsWords` — registered first in
    # `kCjkFontFallback` so CanvasKit consults it before falling
    # through to the CSS-only system-font names (which are still kept
    # as further fallbacks for native iOS / macOS / Android where the
    # OS fonts ARE accessible to Flutter).
    - family: NotoSansSC-YsWords
      fonts:
        - asset: assets/fonts/NotoSansSC-YsWords.otf

    # Microsoft YaHei was previously bundled here. It is a proprietary
    # Microsoft font (licence forbids redistribution), so we removed it
    # in 2026-05 — Chinese readers now fall back to Google Fonts'
    # Noto Sans SC / Noto Serif SC (SIL OFL, freely distributable) and
    # the system installed PingFang SC / SimSun.

# Note:
# For Flutter Web, the browser tab icon (favicon) is located at:
# web/favicon.png
# You may need to manually replace or symlink it using:
# ln -sf ../assets/app_icon.png web/favicon.png

flutter_icons:
  image_path: "assets/app_icon.png"
  android:
    generate: true
  ios:
    generate: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
