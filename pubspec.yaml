name: yswords
description: "YsWords means Yahweh's words. A bilingual Bible app to help you listen to His voice and abide in Him daily."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  provider: ^6.1.1
  scroll_to_index: ^3.0.1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.2
  # Cloud sync (optional — see lib/firebase_options.dart for setup).
  #
  # IMPORTANT: keep firebase_core / _auth / cloud_firestore on the
  # SAME major-version family. firebase_core 3.x + 4.x had a known
  # transitive resolution bug where pub picked
  # firebase_core_platform_interface 6.x (Pigeon-based) alongside
  # firebase_core_web 2.x (no Pigeon handler) → every initializeApp
  # call threw `PlatformException(channel-error, ...
  # FirebaseCoreHostApi.initializeCore)`. firebase_core ^4.0.0 pulls
  # in firebase_core_web 3.x which implements the Pigeon receiver,
  # fixing the channel-error. Bump these together.
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  # Used by AiSearchService to call the Cloud Functions Gemini proxy.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/kjv.json
    - assets/leb.json
    - assets/cuvs-yhwh.json
    - assets/cuvs-yhwh-tr.json
    - assets/biblexg.json
    - assets/biblexg-tr.json
    - assets/biblexg-v2.json
    - assets/biblexg-v2-tr.json
    - assets/cuv.json
    - assets/cuv-tr.json
    - assets/cnv.json
    - assets/cnv-tr.json
    - assets/nasb.json
    - assets/niv.json
    - assets/web-ot-paragraphs.json
    - assets/app_icon.png
    - assets/loading.png
    - assets/fonts/
    - assets/maps/
    - assets/maps_index.json
    - assets/cross_references.json
    - assets/section_titles.json
    - assets/book_introductions.json
    - assets/reading_plans.json
    - assets/gospel_synopsis.json
    - assets/daily_verses.json
    - assets/bible_evidence.json
    - assets/daily_news.json
    - assets/strongs/
    - assets/originals/
    - assets/sermons/index.json
    - assets/sermons/en/
    - assets/sermons/zh-CN/
    - assets/sermons/zh-TW/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf
    - family: Microsoft YaHei
      fonts:
        - asset: assets/fonts/Microsoft Yahei.ttf

# Note:
# For Flutter Web, the browser tab icon (favicon) is located at:
# web/favicon.png
# You may need to manually replace or symlink it using:
# ln -sf ../assets/app_icon.png web/favicon.png

flutter_icons:
  image_path: "assets/app_icon.png"
  android:
    generate: true
  ios:
    generate: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
